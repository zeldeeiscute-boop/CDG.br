name: Build app

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm --windowed --name CDGBrowse cdg_browse.py
      - name: Zip the Mac app
        if: runner.os == 'macOS'
        run: cd dist && zip -r CDGBrowse-mac.zip CDGBrowse.app
      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: CDGBrowse-Mac
          path: dist/CDGBrowse-mac.zip
      - uses: actions/upload-artifact@v4
        if: runner.os != 'macOS'
        with:
          name: CDGBrowse-${{ runner.os }}
          path: dist/CDGBrowse
